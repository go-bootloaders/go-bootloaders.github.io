baseURL = "https://go-bootloaders.github.io/"
title = "go-bootloaders"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Two targets (grub, systemd-boot) have shipped as real, tested Go modules —
# see their own repos for the full API. The rest of this roadmap of the boot
# stacks we mean to reimplement in pure Go is still honest about what's not
# built yet. Each phase names a real upstream bootloader and the status of
# its pure-Go counterpart.
[[params.roadmap]]
  name = "grub"
  upstream = "GNU GRUB"
  status = "shipped"
  blurb = "GRUB administration toolkit: opens a GPT disk image, mounts the ESP and a Linux /boot (ext4/btrfs) read-write, reads/generates/patches grub.cfg, registers a UEFI boot entry, and optionally measures boot into TPM PCRs. 93.9% test coverage; no tagged release yet."
[[params.roadmap]]
  name = "systemd-boot"
  upstream = "systemd-boot (sd-boot)"
  status = "shipped"
  blurb = "Boot Loader Specification reader: GPT-locates the ESP, parses loader.conf + BLS entries, reads/writes UEFI BootOrder/BootNext, and measures the selected kernel/initrd/cmdline into TPM PCRs. 92.9% test coverage; no tagged release yet."
[[params.roadmap]]
  name = "limine"
  upstream = "Limine"
  status = "planned"
  blurb = "Modern x86-64 / aarch64 / riscv64 boot protocol. Compact spec makes it a natural early pure-Go implementation."
[[params.roadmap]]
  name = "syslinux"
  upstream = "Syslinux / ISOLINUX / PXELINUX"
  status = "planned"
  blurb = "Lightweight loaders for FAT, ISO9660 and PXE network boot."
[[params.roadmap]]
  name = "refind"
  upstream = "rEFInd"
  status = "planned"
  blurb = "Graphical UEFI boot manager that auto-discovers EFI boot loaders."
[[params.roadmap]]
  name = "u-boot"
  upstream = "Das U-Boot"
  status = "planned"
  blurb = "Embedded / SoC boot firmware across many architectures."

[params.brand]

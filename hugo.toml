baseURL = "https://go-bootloaders.github.io/"
title = "go-bootloaders"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# go-bootloaders is early-stage: no library has shipped yet. The landing is
# honest about that — a roadmap of the boot stacks we mean to reimplement in
# pure Go, not a wall of repo cards for code that does not exist. Each phase
# names a real upstream bootloader and the status of its pure-Go counterpart.
[[params.roadmap]]
  name = "grub"
  upstream = "GNU GRUB"
  status = "scaffolding"
  blurb = "Multiboot/Multiboot2 loader and menu. First target — repository scaffolded, no functional code yet."
[[params.roadmap]]
  name = "limine"
  upstream = "Limine"
  status = "planned"
  blurb = "Modern x86-64 / aarch64 / riscv64 boot protocol. Compact spec makes it a natural early pure-Go implementation."
[[params.roadmap]]
  name = "syslinux"
  upstream = "Syslinux / ISOLINUX / PXELINUX"
  status = "planned"
  blurb = "Lightweight loaders for FAT, ISO9660 and PXE network boot."
[[params.roadmap]]
  name = "refind"
  upstream = "rEFInd"
  status = "planned"
  blurb = "Graphical UEFI boot manager that auto-discovers EFI boot loaders."
[[params.roadmap]]
  name = "systemd"
  upstream = "systemd-boot (sd-boot)"
  status = "planned"
  blurb = "Simple UEFI boot manager with Boot Loader Specification entries."
[[params.roadmap]]
  name = "u-boot"
  upstream = "Das U-Boot"
  status = "planned"
  blurb = "Embedded / SoC boot firmware across many architectures."
